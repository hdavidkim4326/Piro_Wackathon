services:
  postgres:
    image: postgres:15-alpine
    container_name: campusturf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusturf
      POSTGRES_PASSWORD: campusturf1234
      POSTGRES_DB: campusturf_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusturf -d campusturf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusturf_backend
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campusturf_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:

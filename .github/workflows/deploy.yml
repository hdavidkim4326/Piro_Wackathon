name: Deploy to AWS

on:
  push:
    branches: [main, deploy]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required frontend secrets
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "Missing secret: VITE_API_BASE_URL"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_KAKAO_MAP_KEY }}" ]; then
            echo "Missing secret: VITE_KAKAO_MAP_KEY"
            exit 1
          fi

      - name: Create frontend production env
        run: |
          cat > client/.env.production <<EOF
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_MAP_KEY=${{ secrets.VITE_KAKAO_MAP_KEY }}
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy static files to S3
        run: aws s3 sync client/dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Deploy backend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Piro_Wackathon
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build postgres backend
            sleep 5
            if ! curl -fsS http://localhost:8000/health; then
              echo "Backend health check failed"
              docker compose ps
              docker compose logs --tail=200 backend postgres
              exit 1
            fi

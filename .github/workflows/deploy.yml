name: Deploy to AWS

on:
  push:
    branches: [ main, deploy ] # main/deploy 브랜치에 push될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. 프론트엔드 빌드 및 S3 업로드
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Vite가 요구하는 20버전 이상으로 설정
          cache: 'npm'       # npm 캐시를 사용하면 다음 빌드부터 훨씬 빨라집니다.
          cache-dependency-path: client/package-lock.json # 캐시 기준 파일 경로

      - name: Install & Build Client
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: |
          if [ -z "$VITE_KAKAO_MAP_KEY" ]; then
            echo "VITE_KAKAO_MAP_KEY secret is not set"
            exit 1
          fi
          cd client
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to S3
        run: |
          aws s3 sync client/dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # 2. EC2 백엔드 배포 (SSH 접속 후 git pull & docker compose)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Piro_Wackathon
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build backend postgres
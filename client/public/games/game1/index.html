<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1단계: 광클 영토 확장</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>🔥 1단계: 광클 영토 확장</h2>
        <p>10초 안에 60번 이상 터치하세요!</p>

        <div class="status-board">
            <div class="time">⏱ <span id="time-left">10</span>초</div>
            <div class="score">👆 <span id="current-score">0</span>번</div>
        </div>

        <button id="tap-btn" disabled>준비...</button>
        <br>
        <button id="start-btn">게임 시작!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

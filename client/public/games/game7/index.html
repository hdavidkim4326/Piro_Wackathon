<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>두더지 잡기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>🥜 두더지 잡기</h2>
        <p>나쁜 벌레(🐛)는 때리고,<br>다람쥐(🐿️)는 피하세요! (-2점)</p>

        <div id="game-play-area">
            <div class="status-board">
                <div class="time">⏱ 시간: <span id="time-left">20</span>초</div>
                <div class="score">💥 점수: <span id="current-score">0</span>/15</div>
            </div>

            <div id="mole-grid">
                <div class="hole" id="hole-0"></div>
                <div class="hole" id="hole-1"></div>
                <div class="hole" id="hole-2"></div>
                <div class="hole" id="hole-3"></div>
                <div class="hole" id="hole-4"></div>
                <div class="hole" id="hole-5"></div>
                <div class="hole" id="hole-6"></div>
                <div class="hole" id="hole-7"></div>
                <div class="hole" id="hole-8"></div>
            </div>
            
            <div id="ready-cover">
                 <button id="start-btn">게임 시작!</button>
            </div>
        </div>

        <div id="result-modal" class="hidden">
            <div class="modal-content">
                <h3 id="modal-title">결과</h3>
                <p id="modal-message">메시지 내용</p>
                <button id="modal-close-btn">확인</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

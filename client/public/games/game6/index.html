<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>방향 스와이프</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>🥜 방향 스와이프</h2>
        <p>10초 안에 화살표 방향으로 15번 슬라이드!</p>

        <div id="game-play-area">
            <div class="status-board">
                <div class="time">⏱ 남은 시간: <span id="time-left">10</span>초</div>
                <div class="score">✔ 성공: <span id="success-count">0</span>/15</div>
            </div>

            <div id="swipe-area">
                <div id="arrow-display">❓</div>
                <div id="feedback-text">방향을 맞춰보세요!</div>
            </div>
            
            <div id="ready-cover">
                 <button id="start-btn">게임 시작!</button>
            </div>
        </div>

        <div id="result-modal" class="hidden">
            <div class="modal-content">
                <h3 id="modal-title">결과</h3>
                <p id="modal-message">메시지 내용</p>
                <button id="modal-close-btn">확인</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

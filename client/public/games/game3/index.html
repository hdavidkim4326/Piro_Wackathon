<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>땅콩 받아먹기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>🥜 땅콩 받아먹기</h2>
        <p>맛있는 땅콩(🥜)은 받고,<br>돌멩이(🪨)는 피하세요! (목표: 150점)</p>

        <div id="game-play-area">
            <div class="status-board">
                <div class="time">⏱ 남은 시간: <span id="time-left">30</span>초</div>
                <div class="score">⭐ 점수: <span id="current-score">0</span>점</div>
            </div>

            <div id="game-area">
                <div id="catcher">🧺</div>
            </div>
            
            <div id="ready-cover">
                 <button id="start-btn">게임 시작!</button>
            </div>
        </div>

        <div id="result-modal" class="hidden">
            <div class="modal-content">
                <h3 id="modal-title">결과</h3>
                <p id="modal-message">메시지 내용</p>
                <button id="modal-close-btn">확인</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

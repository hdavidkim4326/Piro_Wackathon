<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타이밍 멈추기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>🥜 타이밍 멈추기</h2>
        <p>초록색 영역에 바가 왔을 때 멈추세요!<br>(7번 중 4번 성공 시 점령)</p>

        <div id="game-play-area">
            <div class="status-board">
                <div class="chance">💖 기회: <span id="chances-left">7</span>번</div>
                <div class="score">✔ 성공: <span id="success-count">0</span>번</div>
            </div>

            <div class="gauge-box">
                <div class="target-zone" id="target-zone"></div>
                <div class="moving-bar" id="moving-bar"></div>
            </div>

            <button id="action-btn" disabled>멈춤!</button>
            
            <div id="ready-cover">
                <button id="start-btn">게임 시작!</button>
            </div>
        </div>

        <div id="result-modal" class="hidden">
            <div class="modal-content">
                <h3 id="modal-title">결과</h3>
                <p id="modal-message">메시지 내용</p>
                <button id="modal-close-btn">확인</button>
            </div>
        </div>
    </div>

    <script src="../gameBridge.js"></script>`r`n    <script src="script.js"></script>
</body>
</html>

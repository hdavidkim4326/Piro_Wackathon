<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2단계: 타이밍 게이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>⚡ 2단계: 타이밍 멈추기</h2>
        <p>초록색 영역에 바가 왔을 때 멈추세요!<br>(7번 중 4번 성공 시 점령)</p>

        <div class="status-board">
            <div class="chance">남은 기회: <span id="chances-left">7</span>번</div>
            <div class="score">성공: <span id="success-count">0</span>번</div>
        </div>

        <div class="gauge-box">
            <div class="target-zone" id="target-zone"></div>
            <div class="moving-bar" id="moving-bar"></div>
        </div>

        <button id="action-btn" disabled>멈춤!</button>
        <br>
        <button id="start-btn">게임 시작!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>열정 쉐이킹</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>🥜 열정 쉐이킹</h2>
        <p>10초 안에 핸드폰을 미친 듯이 흔드세요!</p>

        <div id="game-play-area">
            <div class="status-board">
                <div class="time">⏱ 남은 시간: <span id="time-left">10</span>초</div>
                <div class="score">💦 흔들기: <span id="current-score">0</span>/30</div>
            </div>

            <div id="shake-area">
                <div id="liquid"></div>
                <div id="shake-text">SHAKE!!</div>
            </div>
            
            <div id="ready-cover">
                 <button id="start-btn">게임 시작!</button>
            </div>
        </div>

        <div id="result-modal" class="hidden">
            <div class="modal-content">
                <h3 id="modal-title">결과</h3>
                <p id="modal-message">메시지 내용</p>
                <button id="modal-close-btn">확인</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4단계: 캠퍼스 짝맞추기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <h2>🃏 4단계: 캠퍼스 짝맞추기</h2>
        <p>20초 안에 6쌍의 짝을 모두 찾으세요!</p>

        <div class="status-board">
            <div class="time">⏱ 남은 시간: <span id="time-left">20</span>초</div>
            <div class="score">✔ 맞춘 갯수: <span id="match-count">0</span>/6</div>
        </div>

        <div id="card-grid"></div>
        
        <div id="ready-cover">
             <button id="start-btn">게임 시작!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
